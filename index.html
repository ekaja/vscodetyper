<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Studio Code</title>
    <link rel="icon" type="image/svg+xml" href="/vscode-icon.svg" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <!-- Title Bar -->
      <div id="title-bar">
        <div id="title-bar-left">
          <img src="/vscode-icon.svg" width="16" height="16" alt="VSCode" id="title-logo" />
          <div class="title-menu-item">File</div>
          <div class="title-menu-item">Edit</div>
          <div class="title-menu-item">Selection</div>
          <div class="title-menu-item">View</div>
          <div class="title-menu-item">Go</div>
          <div class="title-menu-item">Run</div>
          <div class="title-menu-item">Terminal</div>
          <div class="title-menu-item">Help</div>
        </div>
        <div id="title-bar-center">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="opacity:0.5;margin-right:5px;flex-shrink:0;">
            <circle cx="6.5" cy="6.5" r="4.5" stroke="#cccccc" stroke-width="1.2"/>
            <path d="M10 10L13.5 13.5" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <span id="title-center-text">vscodetyper</span>
        </div>
        <div id="title-bar-right">
          <div class="window-btn minimize">─</div>
          <div class="window-btn maximize">□</div>
          <div class="window-btn close">✕</div>
        </div>
      </div>

      <!-- Main Layout -->
      <div id="main-layout">
        <!-- Activity Bar -->
        <div id="activity-bar">
          <div class="activity-icon active" title="Explorer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M3 4a1 1 0 011-1h5.586a1 1 0 01.707.293L12 5h8a1 1 0 011 1v13a1 1 0 01-1 1H4a1 1 0 01-1-1V4z" stroke="currentColor" stroke-width="1.4" fill="none"/>
            </svg>
          </div>
          <div class="activity-icon" title="Search">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.4"/>
              <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="activity-icon" title="Source Control">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle cx="6" cy="18" r="2.5" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="6" cy="6" r="2.5" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="18" cy="6" r="2.5" stroke="currentColor" stroke-width="1.4"/>
              <path d="M6 8.5v7M8.5 6h5a4.5 4.5 0 010 9H12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="activity-icon" title="Run and Debug">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M8 5.14v14l11-7-11-7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="activity-icon" title="Extensions">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M20.5 7.5l-4-4-3 3-3-3-4 4 3 3-3 3 4 4 3-3 3 3 4-4-3-3 3-3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="activity-icon bottom" title="Settings">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.4"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </div>
        </div>

        <!-- Sidebar -->
        <div id="sidebar">
          <div id="sidebar-header">EXPLORER</div>
          <div id="sidebar-section-header">
            <svg width="12" height="12" viewBox="0 0 12 12" class="collapse-arrow">
              <path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            </svg>
            <span id="repo-folder-name">VSCODETYPER</span>
          </div>
          <div id="file-tree"></div>
        </div>

        <!-- Editor Area -->
        <div id="editor-area">
          <!-- Tabs -->
          <div id="tab-bar">
            <div id="tabs-container"></div>
          </div>

          <!-- Breadcrumb -->
          <div id="breadcrumb">
            <span id="breadcrumb-content">
              <span class="breadcrumb-item">Start typing to begin...</span>
            </span>
          </div>

          <!-- Code Editor -->
          <div id="editor-container">
            <div id="line-numbers"><span>1</span></div>
            <div id="code-scroll-area">
              <pre id="code-display"><code id="code-content"></code><span id="editor-cursor"> </span></pre>
            </div>
          </div>
        </div>
      </div>

      <!-- Status Bar -->
      <div id="status-bar">
        <div id="status-left">
          <span class="status-item status-branch">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:3px;">
              <circle cx="6" cy="18" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="6" cy="6" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="18" cy="6" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M6 8.5v7M8.5 6h5a4.5 4.5 0 010 9H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span id="status-branch-name">main</span>
          </span>
          <span class="status-item" id="status-errors">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" style="vertical-align:middle;margin-right:2px;"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 4.5v4M8 10.5v1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            0
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" style="vertical-align:middle;margin-right:2px;margin-left:6px;"><path d="M8 2L14.5 13H1.5L8 2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 6v4M8 11.5v.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            0
          </span>
        </div>
        <div id="status-right">
          <span class="status-item" id="status-visitors" title="Unique visitors">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="vertical-align:middle;margin-right:4px;">
              <circle cx="8" cy="5" r="2.5" stroke="currentColor" stroke-width="1.2"/>
              <path d="M2 13c0-3 2.5-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            <span id="visitor-count">–</span>
          </span>
          <span class="status-item" id="status-position">Ln 1, Col 1</span>
          <span class="status-item">UTF-8</span>
          <span class="status-item">LF</span>
          <span class="status-item" id="status-language">TypeScript</span>
          <span class="status-item">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" style="vertical-align:middle;margin-right:3px;"><path d="M2 11L8 5l6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Prettier
          </span>
        </div>
      </div>

      <!-- Loading Overlay -->
      <div id="loading-overlay">
        <div id="loading-content">
          <div class="loading-spinner"></div>
          <div id="loading-text">Fetching code from GitHub...</div>
        </div>
      </div>
    </div>
  </body>
</html>
